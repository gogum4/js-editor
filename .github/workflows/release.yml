# 에디터 패키지(@9um4/editor-*) 배포. **자동으로 돌지 않는다** — Actions 탭에서 수동으로 실행한다(docs/RELEASING.md).
# changesets/action이 하는 일: ① 쌓인 changeset이 있으면 "Version Packages" PR을 만든다(버전·CHANGELOG 갱신).
# ② 그 PR을 합쳐서 changeset이 없고 버전이 레지스트리에 없는 상태에서 다시 실행하면 공개 npm에 게시한다(출처 증명 포함, 저장소 비밀 `NPM_TOKEN` 필요).
# 게시는 되돌리기 어렵다(같은 버전 번호를 다시 쓸 수 없다) — 실행하기 전에 RELEASING.md의 점검표를 본다.
name: release

on:
  workflow_dispatch:

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write   # npm 출처 증명(provenance)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@9um4"
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore: 패키지 버전 올리기"
          commit: "chore: 패키지 버전 올리기"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
