<div role="toolbar" aria-label="표 편집" data-testid="table-toolbar" class="table-toolbar" style="position: fixed; top: 6px; left: 8px;">
<button type="button" title="위에 행 추가" data-table-action="addRowBefore">↑ 행</button>
<button type="button" title="아래에 행 추가" data-table-action="addRowAfter">↓ 행</button>
<button type="button" title="왼쪽에 열 추가" data-table-action="addColumnBefore">← 열</button>
<button type="button" title="오른쪽에 열 추가" data-table-action="addColumnAfter">→ 열</button>
<button type="button" title="이 행 삭제" data-table-action="deleteRow" class="is-danger">행 삭제</button>
<button type="button" title="이 열 삭제" data-table-action="deleteColumn" class="is-danger">열 삭제</button>
<button type="button" title="선택한 셀들을 하나로 (셀을 끌어서 여러 개 선택)" disabled="" data-table-action="mergeCells">셀 병합</button>
<button type="button" title="병합한 셀을 나누기" disabled="" data-table-action="splitCell">셀 분할</button>
<button type="button" title="맨 윗줄을 머리글로 바꾸거나 해제" data-table-action="toggleHeaderRow">머리글 행</button>
<button type="button" title="표 전체 삭제" data-table-action="deleteTable" class="is-danger">표 삭제</button>
</div>
